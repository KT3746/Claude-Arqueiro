<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1d3c2e">
  <meta name="description" content="Linha de Frente — artilharia militar por turnos contra a IA, com terreno destrutível, vento e explosões. Roda no navegador, sem instalar nada.">
  <title>Linha de Frente — artilharia por turnos</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f3a28'/><path d='M6 24l6-10 4 5 4-7 6 12z' fill='%235b6b45'/><circle cx='16' cy='9' r='3' fill='%23a68a5b'/></svg>">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Campo de batalha com terreno destrutível"></canvas>

    <button id="pause-button" type="button" aria-label="Pausar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
        <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
        <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
      </svg>
    </button>

    <!--
      Controles em tela: o jogo original (Minhocas) só tinha teclado para
      andar, pular e trocar de arma — no celular só dava para carregar/soltar
      o tiro tocando na tela. Sem estes botões, boa parte do jogo (andar,
      pular, escolher arma) ficaria simplesmente inacessível no Android.
    -->
    <div id="battle-controls" hidden>
      <div class="bc-side bc-side-left">
        <div class="bc-group bc-move">
          <button type="button" data-hold="esquerda" aria-label="Andar para a esquerda">◄</button>
          <button type="button" data-tap="pular" aria-label="Pular">▲</button>
          <button type="button" data-hold="direita" aria-label="Andar para a direita">►</button>
        </div>
      </div>
      <div class="bc-side bc-side-right">
        <div class="bc-group bc-weapon">
          <button type="button" data-tap="arma-anterior" aria-label="Arma anterior">‹</button>
          <span id="bc-weapon-name" class="bc-weapon-name">—</span>
          <button type="button" data-tap="arma-seguinte" aria-label="Próxima arma">›</button>
        </div>
        <div class="bc-group bc-fire-row">
          <div class="bc-group bc-aim">
            <button type="button" data-hold="mira-cima" aria-label="Levantar a mira">▲</button>
            <button type="button" data-hold="mira-baixo" aria-label="Baixar a mira">▼</button>
          </div>
          <button type="button" id="bc-fire" class="bc-fire" aria-label="Segurar para carregar força, soltar para atirar">FOGO</button>
        </div>
      </div>
    </div>

    <div id="ui" hidden></div>

    <noscript>
      <p class="noscript">Este jogo precisa de JavaScript ativado.</p>
    </noscript>
  </main>

  <script type="module" src="../js/frente/main.js"></script>
</body>
</html>
